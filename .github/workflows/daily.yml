name: daily-radar

on:
  schedule:
    # GitHub schedule can start hours late (2026-11-06: the 07:10 slot ran at 11:21 KST).
    # Three slots; once one publishes, the later ones skip (--skip-if-done).
    - cron: "40 21 * * 0-4"   # 06:40 KST, 월~금 (UTC 일~목)
    - cron: "10 22 * * 0-4"   # 07:10 KST
    - cron: "40 22 * * 0-4"   # 07:40 KST
  workflow_dispatch:
    inputs:
      run_date: {description: "KST 날짜 YYYY-MM-DD (비우면 오늘)", required: false}
      skip_llm: {type: boolean, default: false}
      force: {description: "휴장일 무시", type: boolean, default: false}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_status: ${{ steps.run.outputs.run_status }}
      run_date: ${{ steps.run.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - id: run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          uv run python -m radar.run_daily \
            ${RUN_DATE:+--date "$RUN_DATE"} \
            ${{ inputs.skip_llm && '--no-llm' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }} \
            --github-output "$GITHUB_OUTPUT"
      - name: Commit data
        if: ${{ !startsWith(steps.run.outputs.run_status, 'SKIPPED') }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git commit -m "data: ${{ steps.run.outputs.run_date }} (${{ steps.run.outputs.run_status }})" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !startsWith(steps.run.outputs.run_status, 'SKIPPED') }}
        with: {path: site}

  deploy:
    needs: build
    if: ${{ !startsWith(needs.build.outputs.run_status, 'SKIPPED') }}
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4

  notify:   # M13: KakaoTalk "나에게 보내기". Its failure never affects the page.
    needs: [build, deploy]
    if: ${{ !startsWith(needs.build.outputs.run_status, 'SKIPPED') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # includes the data commit made by build
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ROTATED_TOKEN_FILE: ${{ runner.temp }}/kakao_refresh_token
        run: uv run python -m radar.notify.kakao --date "${{ needs.build.outputs.run_date }}"
      - name: Save rotated Kakao refresh token
        if: ${{ always() && hashFiles(format('{0}/kakao_refresh_token', runner.temp)) != '' }}
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}   # fine-grained PAT: this repo, "Secrets: Read and write" only
        run: |
          gh secret set KAKAO_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/kakao_refresh_token"
          rm -f "$RUNNER_TEMP/kakao_refresh_token"

  flag-failure:
    needs: [build, deploy]
    if: always() && (needs.build.outputs.run_status == 'FAILED_INDICATORS' || needs.build.outputs.run_status == 'FAILED' || failure())
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "run_status=${{ needs.build.outputs.run_status }}"
          exit 1   # 워크플로 실패 처리 → GitHub 기본 실패 알림 메일
