[project]
name = "radar"
version = "0.1.0"
description = "Daily US Market & Macro Radar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars>=4.5",
    "feedparser>=6.0.14",
    "finance-datareader>=0.9.202",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=3.46.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external services"]
addopts = "-m 'not live'"
