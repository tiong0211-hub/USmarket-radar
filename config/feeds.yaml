# 뉴스 RSS — verified: true만 수집. 2026-11-05 확인 (Yahoo는 404)
time_window: since_previous_us_close   # 기준 세션 직전 세션의 마감 ~ 실행 시각 (기준 세션 뉴스 포함)
fetch_retry_backoff_s: [2, 2]
max_articles_to_llm: 150
min_articles_warning: 20
feeds:
  - name: CNBC Top News
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
    priority: 1
    verified: true
  - name: CNBC Markets
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    priority: 1
    verified: true
  - name: MarketWatch Top Stories
    url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"
    priority: 2
    verified: true
  - name: Yahoo Finance
    url: "https://finance.yahoo.com/news/rssindex"
    priority: 2
    verified: false
  - name: Google News - US stocks
    url: "https://news.google.com/rss/search?q=stock+market+when:1d&hl=en-US&gl=US&ceid=US:en"
    priority: 3
    verified: true
  - name: Google News - Fed / rates
    url: "https://news.google.com/rss/search?q=Federal+Reserve+OR+Treasury+yields+when:1d&hl=en-US&gl=US&ceid=US:en"
    priority: 3
    verified: true

# 경제 캘린더
calendar:
  primary:
    name: Forex Factory weekly JSON
    url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    filter: {country: USD, impact: [High, Medium]}
    verified: true   # actual 필드 없음. thisweek만 제공 (lastweek/nextweek 404)
  actual_backfill: llm_news   # M6 calendar_actuals
  fetch_retry_backoff_s: [4, 4]
  # 없는 제목은 영어 원문으로 표시
