timezone_display: Asia/Seoul
site_url: "https://tiong0211-hub.github.io/USmarket-radar/"   # OG 이미지 등 절대 URL용
schedule:
  start_kst: "07:10"
  deadline_kst: "07:28"      # 초과 시 비필수 단계(M7 제안, M8) 건너뜀
calendars:
  kr: XKRX
  us: XNYS
color_convention: kr          # 상승 빨강 #c85543 / 하락 파랑 #3073bc (UI 시안 기준, 확정)
ui:
  reference_template: src/radar/render/templates/reference/morning-radar.html
  min_font_px: {body: 12, label: 10}
  themes_display_max: 6       # 지수 대비 강한 상승 종목만, 상승률 순
  og_image: site/static/og.png
  robots: "noindex,nofollow"
market:
  workers: 4
  timeout_s: 120
  retry_backoff_s: [2, 4, 8]
  retry_jitter_s: 1
  intraday_max_age_days: 55   # Yahoo 5분봉 제공 범위 안에서만 요청
module_timeouts_s: {M2: 120, M3: 120, M4: 120, M5: 30, M6: 300, M7: 120, M8: 180}
briefing:
  direction_ko: {gap_up: 갭상승 우세, flat: 보합 우세, gap_down: 갭하락 우세}
  template_direction_ko: "판단 보류 · 자동 요약"   # LLM 요약이 없거나 숫자 검증에 실패한 날
llm_budget:                   # 일일 토큰 상한 (계정 TPD보다 충분히 낮게)
  gpt-4o-mini: 2000000
  gpt-5.5: 200000
sentiment:
  method: vix_percentile_252d_v0   # 임시: 100 - (VIX 252일 백분위). M12 협의 때 확정
  bands:
  min_history: 200                 # VIX 종가가 이보다 적으면 산출 불가
  note_ko: "VIX 기반 자체 산출 · CNN Fear & Greed 아님"
  bands:
    - {max: 24, label: 극도의 공포, label_en: EXTREME FEAR}
    - {max: 44, label: 공포, label_en: FEAR}
    - {max: 55, label: 중립, label_en: NEUTRAL}
    - {max: 75, label: 탐욕, label_en: GREED}
    - {max: 100, label: 극도의 탐욕, label_en: EXTREME GREED}
movers:
  workers: 6
  retry_backoff_s: [2, 2]
themes:
  benchmark_key: SPX          # symbols.yaml 지표 key. 이 지수보다 강하게 오른 종목만 표시·제안
  min_excess_pct: 1.0         # 상승률 − 지수 등락률 ≥ 이 값(%p), 그리고 상승률 > 0
  proposal_min_change_pct: 3.0  # 미매핑 종목이 이만큼 오르고 뉴스에 나와야 자동 매핑 생성
  auto_review_days: 30        # 자동 매핑(data/theme_auto.json)은 이 기간이 지나면 다시 주도주가 됐을 때 최신 뉴스로 재판단
  proposal_max_tickers: 3
  issue_label: theme-proposal
news:
  top_n_display: 8
  min_importance_display: 3
  picker_movers_max: 6        # 뉴스 선별 근거로 넘길 등락률 상위 종목·ETF 수(지수·금리·환율·VIX는 항상 포함)
  importance_labels: {5: 관찰 중요도 높음, 4: 관찰 중요도 높음, 3: 업종 확산 관찰}
  filter_labels: {macro_rates: 매크로, theme_earnings: 테마·실적, geopolitics_commodities: 원자재·리스크}
calendar:
  upcoming_window_kst: ["18:00", "06:00"]   # 오늘 밤 체크포인트 범위
  upcoming_importance: [high]   # 체크포인트는 지수를 움직이는 고영향 지표만(medium 제외). 어젯밤 결과는 그대로
disclaimer_ko: "본 페이지는 공개 데이터를 자동 요약한 참고 자료이며 투자 권유가 아닙니다. 투자 판단과 책임은 본인에게 있습니다."
